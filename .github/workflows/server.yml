name: PlatCode Backend

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./plate-server
          push: true
          tags: |
            ghcr.io/whatnext-id/plate-code-detector:latest
            ghcr.io/whatnext-id/plate-code-detector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to server
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" << 'EOF'

          set -e

          cd ~/PlateCode/plate-server

          echo "Pulling latest image..."
          docker compose pull

          echo "Starting application..."
          docker compose up -d

          echo "Application status..."
          docker compose ps

          EOF
