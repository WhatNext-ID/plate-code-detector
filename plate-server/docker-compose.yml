name: plate-server
services:
  api:
    image: ghcr.io/whatnext-id/plate-code-detector:${IMAGE_TAG:-latest}

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      SECRET: ${SECRET}
      GIN_MODE: ${GIN_MODE}
      ORIGIN: ${ORIGIN}

    restart: unless-stopped

    mem_limit: 128m
    cpus: '0.5'

    ports:
      - '${PORT}:5050'
